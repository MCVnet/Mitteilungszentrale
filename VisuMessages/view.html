<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Visu-Messages</title>
<style>
:root{color-scheme:light dark;--bg:#f4f6f8;--card:#fff;--text:#182738;--muted:#607080;--line:#dce3e9;--accent:#176b57}
@media(prefers-color-scheme:dark){:root{--bg:#141c25;--card:#1e2a36;--text:#edf3f7;--muted:#a9b9c8;--line:#374652;--accent:#7ed8b6}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,sans-serif}main{max-width:1000px;margin:auto;padding:18px}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}h1{font-size:21px;margin:0;flex:1}.count{font-size:13px;color:var(--muted)}button{font:inherit;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--text);padding:9px 12px;min-height:42px;cursor:pointer}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}button:disabled{opacity:.45;cursor:default}article{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:10px}article.pinned{border-left:4px solid var(--accent)}.meta{color:var(--muted);font-size:12px;margin-bottom:7px}.message{white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.badge{color:var(--accent);font-weight:600;margin-right:8px}.empty{text-align:center;color:var(--muted);padding:55px 15px;border:1px dashed var(--line);border-radius:12px}#status{font-size:12px;color:var(--muted);min-height:20px;margin-top:12px}#status.error{color:#cb453d}.note{font-size:12px;color:var(--muted);margin-top:12px}
</style>
</head>
<body><main>
<header><h1>Meldungen</h1><span id="count" class="count"></span><button id="clear" type="button">Nicht angepinnte löschen</button></header>
<section id="list" aria-label="Meldungsliste"></section>
<div id="status" role="status" aria-live="polite"></div>
<div class="note">Angepinnte Meldungen bleiben oben und werden beim Sammellöschen erhalten.</div>
</main>
<script>
'use strict';
const config = __MZ_CONFIG__;
const list = document.getElementById('list');
const status = document.getElementById('status');
let messages = config.messages || [];
let rendered = '';
let busy = false;
let pending = null;
function report(text, error) { status.textContent = text; status.className = error ? 'error' : ''; }
function element(tag, className, text) { const e=document.createElement(tag); if(className)e.className=className; if(text!==undefined)e.textContent=text; return e; }
function render(items) {
  messages=items;
  const signature=JSON.stringify(items);
  if(signature===rendered)return;
  rendered=signature;
  const focus=document.activeElement?.dataset?.key;
  list.replaceChildren();
  document.getElementById('count').textContent=items.length+' Einträge';
  document.getElementById('clear').disabled=!items.some(m=>!m.pinned);
  if(!items.length)list.append(element('div','empty','Keine Meldungen vorhanden.'));
  for(const m of items){
    const card=element('article',m.pinned?'pinned':'');
    const meta=element('div','meta');
    if(m.pinned)meta.append(element('span','badge','Angepinnt'));
    meta.append(document.createTextNode(new Date(m.time*1000).toLocaleString('de-DE')+' · '+m.source));
    card.append(meta,element('div','message',m.text));
    const actions=element('div','actions');
    const pin=element('button','',m.pinned?'Lösen':'Anpinnen'); pin.type='button'; pin.dataset.key='pin-'+m.id; pin.setAttribute('aria-pressed',String(m.pinned));
    pin.onclick=()=>act(m.pinned?'Unpin':'Pin',m.id);
    const del=element('button','','Löschen'); del.type='button';del.dataset.key='delete-'+m.id;del.disabled=m.pinned;del.title=m.pinned?'Zum Löschen zuerst lösen':'Meldung löschen';
    del.onclick=()=>act('Delete',m.id);
    actions.append(pin,del);card.append(actions);list.append(card);
  }
  if(focus)Array.from(list.querySelectorAll('button')).find(e=>e.dataset.key===focus)?.focus();
}
async function webRequest(action,id){
  const url=new URL(location.href); url.search='?api=1'; url.hash='';
  const options={cache:'no-store',headers:{'X-MZ-Token':config.token},signal:AbortSignal.timeout(12000)};
  if(action){options.method='POST';options.headers['Content-Type']='application/json';options.body=JSON.stringify({action,id});}
  const response=await fetch(url,options);
  if(!response.ok)throw new Error(response.status===403?'Zugriffsschlüssel ungültig. Ansicht mit aktueller Adresse neu öffnen.':'Anfrage fehlgeschlagen ('+response.status+'). Bitte erneut versuchen.');
  return response.json();
}
async function act(action,id=0){
  if(busy)return;
  busy=true;report('Wird gespeichert …',false);
  try{
    if(config.mode==='sdk'){
      requestAction(action,id);
      pending=setTimeout(()=>{busy=false;report('Keine Bestätigung erhalten. Ansicht aktualisieren.',true);},12000);
    }else{
      const data=await webRequest(action,id);render(data.messages);busy=false;report('Gespeichert',false);
    }
  }catch(e){busy=false;report(e.message,true);}
}
function handleMessage(data){
  try{const value=typeof data==='string'?JSON.parse(data):data;render(value.messages);clearTimeout(pending);busy=false;report('Aktuell',false);}catch(e){report('Aktualisierung konnte nicht gelesen werden.',true);}
}
document.getElementById('clear').onclick=()=>{
  if(confirm('Alle nicht angepinnten Meldungen löschen?'))act('Clear');
};
render(messages);
if(config.mode==='sdk'){
  requestAction('Refresh',0);
}else{
  // Schlüssel aus der sichtbaren Adresse entfernen; im Speicher für API-Aufrufe behalten.
  try{history.replaceState(null,'',location.pathname);}catch(e){}
  const poll=async()=>{
    if(!busy&&!document.hidden){
      busy=true;
      try{const data=await webRequest();render(data.messages);report('Aktuell · automatische Aktualisierung',false);}catch(e){report(e.message,true);}finally{busy=false;}
    }
    setTimeout(poll,3000);
  };
  poll();
}
</script></body></html>
