<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Visu-Messages</title>
<style>
:root{color-scheme:light dark;--bg:#f4f6f8;--card:#fff;--text:#182738;--muted:#607080;--line:#dce3e9;--accent:#176b57}
@media(prefers-color-scheme:dark){:root{--bg:#141c25;--card:#1e2a36;--text:#edf3f7;--muted:#a9b9c8;--line:#374652;--accent:#7ed8b6}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,sans-serif}main{max-width:1000px;margin:auto;padding:18px}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}h1{font-size:21px;margin:0;flex:1}.count{font-size:13px;color:var(--muted)}button{font:inherit;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--text);padding:9px 12px;min-height:42px;cursor:pointer}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}button:disabled{opacity:.45;cursor:default}article{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:10px}article.pinned{border-left:4px solid var(--accent)}.meta{color:var(--muted);font-size:12px;margin-bottom:7px}.message{white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.badge{color:var(--accent);font-weight:600;margin-right:8px}.empty{text-align:center;color:var(--muted);padding:55px 15px;border:1px dashed var(--line);border-radius:12px}#status{font-size:12px;color:var(--muted);min-height:20px;margin-top:12px}#status.error{color:#cb453d}.note{font-size:12px;color:var(--muted);margin-top:12px}
</style>
<style>
article{display:grid;grid-template-columns:var(--icon-size,48px) minmax(0,1fr);column-gap:14px;width:100%;max-width:var(--message-max-width,760px);min-width:min(100%,var(--message-min-width,240px))}
.message-icon{align-self:center;display:flex;align-items:center;justify-content:center;width:var(--icon-size,48px);height:var(--icon-size,48px);color:var(--accent)}
.message-icon svg,.message-icon img{display:block;width:var(--icon-size,48px);height:var(--icon-size,48px);object-fit:contain}
.message-content{min-width:0}.actions{flex-wrap:wrap}
@media(max-width:400px){article{grid-template-columns:min(var(--icon-size,48px),48px) minmax(0,1fr);column-gap:10px;padding:12px}.message-icon{width:min(var(--icon-size,48px),48px);height:min(var(--icon-size,48px),48px)}.message-icon svg,.message-icon img{width:min(var(--icon-size,48px),48px);height:min(var(--icon-size,48px),48px)}}
</style>
</head>
<body><main>
<header><h1>Meldungen</h1><span id="count" class="count"></span><button id="clear" type="button">Nicht angepinnte löschen</button></header>
<div id="clearConfirmation" hidden role="group" aria-label="Sammellöschen bestätigen" style="margin-bottom:16px">
<p>Alle nicht angepinnten Meldungen löschen? Angepinnte Meldungen bleiben erhalten.</p>
<button id="confirmClear" type="button">Jetzt löschen</button>
<button id="cancelClear" type="button">Abbrechen</button>
</div>
<section id="list" aria-label="Meldungsliste"></section>
<div id="status" role="status" aria-live="polite"></div>
<div class="note">Angepinnte Meldungen bleiben oben und werden beim Sammellöschen erhalten. · Visu-Messages 0.13</div>
</main>
<script>
'use strict';
const config = __MZ_CONFIG__;
if(config.mode==='sdk'){
  // Symcon overlays its tile title and controls above the iframe.
  // Keep clickable content below the reserved top area.
  const inset=Number(new URLSearchParams(location.search).get('margintop'));
  document.querySelector('main').style.paddingTop=Math.max(60,Math.min(200,Number.isFinite(inset)?inset:60))+'px';
}
const list = document.getElementById('list');
const status = document.getElementById('status');
let messages = config.messages || [];
let rendered = '';
let busy = false;
let pending = null;
let iconLibrary=null;
const iconCache=new Map();
function applyAppearance(appearance){
  if(!appearance)return;
  const root=document.documentElement;
  root.style.setProperty('--icon-size',Math.max(24,Math.min(96,Number(appearance.iconSize)||48))+'px');
  if(appearance.colors){
    for(const key of ['bg','card','text','accent']){
      if(/^#[0-9a-f]{6}$/i.test(appearance.colors[key]||''))root.style.setProperty('--'+key,appearance.colors[key]);
    }
    root.style.setProperty('--muted','var(--text)');
    root.style.setProperty('--line','color-mix(in srgb,var(--text) 22%,var(--card))');
  }else{
    for(const key of ['bg','card','text','accent','muted','line'])root.style.removeProperty('--'+key);
  }
  const min=Math.max(120,Math.min(3000,Number(appearance.minWidth)||240));
  const max=Math.max(min,Math.min(3000,Number(appearance.maxWidth)||760));
  root.style.setProperty('--message-min-width',min+'px');
  root.style.setProperty('--message-max-width',max+'px');
  document.querySelector('main').style.maxWidth=Math.max(1000,max+36)+'px';
}
function envelope(){
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  for(const [key,value] of Object.entries({viewBox:'0 0 24 24',fill:'none',stroke:'currentColor','stroke-width':'1.6','stroke-linecap':'round','stroke-linejoin':'round'}))svg.setAttribute(key,value);
  const path=document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d','M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Zm-1 1 9 7 9-7');
  svg.append(path);return svg;
}
function drawMessageIcon(box){
  const raw=box.dataset.icon||'';
  if(!raw){box.replaceChildren(envelope());return;}
  if(iconCache.has(raw)){box.replaceChildren(iconCache.get(raw).cloneNode(true));return;}
  const tuple=(config.iconDefinitions||{})[raw];
  if(tuple){
    const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('viewBox','0 0 '+tuple[0]+' '+tuple[1]);svg.setAttribute('data-icon',raw);
    for(const data of Array.isArray(tuple[4])?tuple[4]:[tuple[4]]){
      const path=document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('fill','currentColor');path.setAttribute('d',data);svg.append(path);
    }
    iconCache.set(raw,svg.cloneNode(true));box.replaceChildren(svg);return;
  }
  box.replaceChildren();box.textContent='…';box.title='Symbol wird geladen: '+raw;
  if(!/^[A-Za-z0-9 _-]{1,160}$/.test(raw)){box.textContent='?';return;}
  const words=raw.split(/\s+/);
  const style=words.find(w=>['fa-light','fal','fa-brands','fab','fa-kit','fak'].includes(w));
  const pref=style&&({'fa-light':'fal','fa-brands':'fab','fa-kit':'fak'}[style]||style);
  const name=(words.find(w=>w.startsWith('fa-')&&!['fa-light','fa-brands','fa-kit'].includes(w))||words.at(-1)).replace(/^fa-/,'');
  const names=[name,name.replace(/([a-z])([A-Z])/g,'$1-$2').toLowerCase(),name.toLowerCase()];
  const fa=window.FontAwesome||iconLibrary;
  if(fa)iconLibrary=fa;
  if(fa&&typeof fa.findIconDefinition==='function'){
    for(const prefix of pref?[pref]:['fal','fak','fab'])for(const iconName of names){
      const definition=fa.findIconDefinition({prefix,iconName});
      if(definition){
        const result=fa.icon(definition);
        if(result&&result.node&&result.node[0]){const node=result.node[0].cloneNode(true);iconCache.set(raw,node.cloneNode(true));box.replaceChildren(node);box.title='';return;}
      }
    }
  }
  // Legacy Symcon object/profile icons use their original SVG names.
  if(/^[A-Z][A-Za-z0-9_-]*$/.test(raw)){
    const img=document.createElement('img');img.alt='';
    img.onload=()=>{iconCache.set(raw,img.cloneNode(true));box.replaceChildren(img);box.title='';};
    img.onerror=()=>{box.textContent='?';box.title='Symbol konnte nicht geladen werden: '+raw;};
    img.src='/legacy/img/icons/'+encodeURIComponent(raw)+'.svg';
  }
}
function messageIcon(raw){
  const box=element('div','message-icon');box.setAttribute('aria-hidden','true');box.dataset.icon=typeof raw==='string'?raw:'';
  drawMessageIcon(box);return box;
}
function loadIconLibrary(){
  if(config.mode==='sdk'&&config.iconDefinitions)return;
  if(window.FontAwesome){iconLibrary=window.FontAwesome;return;}
  // Insert explicitly: embedded SDK clients do not consistently execute deferred script tags.
  const script=document.createElement('script');script.async=true;script.src=config.iconScriptURL||'/icons.js';
  script.onload=()=>{iconLibrary=window.FontAwesome;for(const box of document.querySelectorAll('.message-icon'))drawMessageIcon(box);};
  script.onerror=()=>{for(const box of document.querySelectorAll('.message-icon'))if(box.dataset.icon&&!iconCache.has(box.dataset.icon)){box.textContent='?';box.title='Symcon-Symbolbibliothek konnte nicht geladen werden.';}};
  document.head.append(script);
}
loadIconLibrary();
applyAppearance(config.appearance);
function report(text, error) { status.textContent = text; status.className = error ? 'error' : ''; }
function element(tag, className, text) { const e=document.createElement(tag); if(className)e.className=className; if(text!==undefined)e.textContent=text; return e; }
function render(items) {
  messages=items;
  const signature=JSON.stringify(items);
  if(signature===rendered)return;
  rendered=signature;
  const focus=document.activeElement?.dataset?.key;
  list.replaceChildren();
  document.getElementById('count').textContent=items.length+' Einträge';
  document.getElementById('clear').disabled=!items.some(m=>!m.pinned);
  if(!items.length)list.append(element('div','empty','Keine Meldungen vorhanden.'));
  for(const m of items){
    const card=element('article',m.pinned?'pinned':'');
    const content=element('div','message-content');
    const meta=element('div','meta');
    if(m.pinned)meta.append(element('span','badge','Angepinnt'));
    meta.append(document.createTextNode(new Date(m.time*1000).toLocaleString('de-DE')+' · '+m.source));
    content.append(meta,element('div','message',m.text));
    const actions=element('div','actions');
    const pin=element('button','',m.pinned?'Lösen':'Anpinnen'); pin.type='button'; pin.dataset.key='pin-'+m.id; pin.setAttribute('aria-pressed',String(m.pinned));
    pin.onclick=()=>act(m.pinned?'Unpin':'Pin',m.id);
    const del=element('button','','Löschen'); del.type='button';del.dataset.key='delete-'+m.id;del.disabled=m.pinned;del.title=m.pinned?'Zum Löschen zuerst lösen':'Meldung löschen';
    del.onclick=()=>act('Delete',m.id);
    actions.append(pin,del);content.append(actions);card.append(messageIcon(m.icon),content);list.append(card);
  }
  if(focus)Array.from(list.querySelectorAll('button')).find(e=>e.dataset.key===focus)?.focus();
}
async function webRequest(action,id){
  const url=new URL(location.href); url.search='?api=1'; url.hash='';
  const options={cache:'no-store',headers:{'X-MZ-Token':config.token},signal:AbortSignal.timeout(12000)};
  if(action){options.method='POST';options.headers['Content-Type']='application/json';options.body=JSON.stringify({action,id});}
  const response=await fetch(url,options);
  if(!response.ok)throw new Error(response.status===403?'Zugriffsschlüssel ungültig. Ansicht mit aktueller Adresse neu öffnen.':'Anfrage fehlgeschlagen ('+response.status+'). Bitte erneut versuchen.');
  return response.json();
}
async function act(action,id=0){
  if(busy)return;
  busy=true;report('Wird gespeichert …',false);
  try{
    if(config.mode==='sdk'){
      pending=setTimeout(()=>{busy=false;report('Keine Bestätigung erhalten. Ansicht aktualisieren.',true);},12000);
      requestAction(action==='Clear'?'ClearUnpinned':action,action==='Clear'?1:id);
    }else{
      const data=await webRequest(action,id);applyAppearance(data.appearance);render(data.messages);busy=false;report('Gespeichert',false);
    }
  }catch(e){busy=false;report(e.message,true);}
}
function handleMessage(data){
  try{const value=typeof data==='string'?JSON.parse(data):data;clearTimeout(pending);busy=false;if(value.error){report(value.error,true);return;}applyAppearance(value.appearance);render(value.messages);report('Aktuell',false);}catch(e){report('Aktualisierung konnte nicht gelesen werden.',true);}
}
document.getElementById('clear').onclick=()=>{
  document.getElementById('clearConfirmation').hidden=false;
  document.getElementById('confirmClear').focus();
};
document.getElementById('cancelClear').onclick=()=>{
  document.getElementById('clearConfirmation').hidden=true;
  document.getElementById('clear').focus();
};
document.getElementById('confirmClear').onclick=()=>{
  if(busy){report('Bitte kurz warten und erneut bestätigen.',false);return;}
  document.getElementById('clearConfirmation').hidden=true;
  act('Clear');
};
render(messages);
if(config.mode==='sdk'){
  requestAction('Refresh',0);
}else{
  // Schlüssel aus der sichtbaren Adresse entfernen; im Speicher für API-Aufrufe behalten.
  try{history.replaceState(null,'',location.pathname);}catch(e){}
  const poll=async()=>{
    if(!busy&&!document.hidden){
      busy=true;
      try{const data=await webRequest();applyAppearance(data.appearance);render(data.messages);report('Aktuell · automatische Aktualisierung',false);}catch(e){report(e.message,true);}finally{busy=false;}
    }
    setTimeout(poll,3000);
  };
  poll();
}
</script></body></html>
